name: Test and publish
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the candidate
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t chessgpt:test .
      - name: Smoke-test the exact image and tactical engine
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f chessgpt-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name chessgpt-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 256m --pids-limit 64 \
            -e AI_MODE=demo -p 127.0.0.1:18080:3080 chessgpt:test
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ | grep -F '<title>ChessGPT - Your move.</title>'
          curl -fsS -X POST http://127.0.0.1:18080/api/start | grep -F 'mode="demo"'
          docker exec chessgpt-smoke node --input-type=module -e \
            "import {Chess} from 'chess.js'; import {assistanceFor} from './lib/engine.js'; const a=await assistanceFor(new Chess('8/8/8/5N1R/6k1/8/PPP5/2K5 w - - 0 52'),'hard'); if(!a.allowed.length || a.allowed.includes('h5h4')) process.exit(1); console.log(a.summary);"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested commit image
        id: image
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/badconduct/chessgpt:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Record deployable image
        if: github.event_name == 'push'
        run: echo 'ghcr.io/badconduct/chessgpt@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
